<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diffchecker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #24292f;
    }

    header {
      background: #24292f;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header .subtitle {
      font-size: 0.8rem;
      color: #8b949e;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 260px;
      padding: 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      background: #fff;
      color: #24292f;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: #0969da; }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    #compareBtn {
      background: #2da44e;
      color: #fff;
    }

    #clearBtn {
      background: #e8ecf0;
      color: #24292f;
    }

    #output { display: none; }

    .diff-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-bottom: 0;
    }

    .diff-header span {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .diff-header span:first-child {
      border-right: none;
      border-radius: 6px 0 0 0;
    }

    .diff-header span:last-child {
      border-radius: 0 6px 0 0;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #d0d7de;
      border-top: none;
      border-radius: 0 0 6px 6px;
      overflow: hidden;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .diff-table td {
      padding: 2px 12px;
      vertical-align: top;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diff-table td.linenum {
      width: 44px;
      min-width: 44px;
      padding: 2px 8px;
      text-align: right;
      color: #8b949e;
      user-select: none;
      border-right: 1px solid #d0d7de;
      background: inherit;
    }

    .diff-table tr.added td { background: #e6ffec; }
    .diff-table tr.added td.linenum { background: #ccffd8; color: #2da44e; }

    .diff-table tr.removed td { background: #ffebe9; }
    .diff-table tr.removed td.linenum { background: #ffd7d5; color: #cf222e; }

    .diff-table tr.unchanged td { background: #fff; }

    .diff-table .divider { border-right: 1px solid #d0d7de; }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #57606a;
      font-size: 0.9rem;
      background: #fff;
      border: 1px solid #d0d7de;
      border-top: none;
      border-radius: 0 0 6px 6px;
    }

    .stats {
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #57606a;
    }

    .stats .added-count { color: #2da44e; font-weight: 600; }
    .stats .removed-count { color: #cf222e; font-weight: 600; }

    @media (max-width: 700px) {
      .inputs { grid-template-columns: 1fr; }
      .diff-header { grid-template-columns: 1fr; }
      .diff-header span:first-child { border-right: 1px solid #d0d7de; border-radius: 6px 6px 0 0; border-bottom: none; }
      .diff-header span:last-child { border-radius: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>Diffchecker</h1>
  <span class="subtitle">Compare text differences online</span>
</header>

<div class="container">
  <div class="inputs">
    <div class="input-group">
      <label>Original Text</label>
      <textarea id="original" placeholder="Paste your original text here..."></textarea>
    </div>
    <div class="input-group">
      <label>Changed Text</label>
      <textarea id="modified" placeholder="Paste your changed text here..."></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="compareBtn" onclick="compare()">Find Differences</button>
    <button id="clearBtn" onclick="clearAll()">Clear</button>
  </div>

  <div id="output">
    <div class="stats" id="stats"></div>
    <div class="diff-header">
      <span>Original</span>
      <span>Changed</span>
    </div>
    <div id="diffContainer"></div>
  </div>
</div>

<script>
  function compare() {
    const original = document.getElementById('original').value;
    const modified = document.getElementById('modified').value;

    if (!original.trim() && !modified.trim()) {
      alert('Please enter some text in both fields.');
      return;
    }

    const diff = Diff.diffLines(original, modified, { newlineIsToken: false });

    // Build side-by-side rows
    const leftRows = [];
    const rightRows = [];

    diff.forEach(part => {
      const lines = part.value.replace(/\n$/, '').split('\n');
      if (part.added) {
        lines.forEach(line => rightRows.push({ type: 'added', text: line }));
      } else if (part.removed) {
        lines.forEach(line => leftRows.push({ type: 'removed', text: line }));
      } else {
        lines.forEach(line => {
          leftRows.push({ type: 'unchanged', text: line });
          rightRows.push({ type: 'unchanged', text: line });
        });
      }
    });

    // Pad shorter side with empty rows
    while (leftRows.length < rightRows.length) leftRows.push({ type: 'empty', text: '' });
    while (rightRows.length < leftRows.length) rightRows.push({ type: 'empty', text: '' });

    let addedCount = 0, removedCount = 0;
    let html = '<table class="diff-table"><tbody>';

    let leftLineNum = 0, rightLineNum = 0;

    for (let i = 0; i < leftRows.length; i++) {
      const l = leftRows[i];
      const r = rightRows[i];

      const leftClass = l.type === 'empty' ? 'unchanged' : l.type;
      const rightClass = r.type === 'empty' ? 'unchanged' : r.type;

      if (l.type === 'removed') { removedCount++; leftLineNum++; }
      else if (l.type === 'unchanged') leftLineNum++;

      if (r.type === 'added') { addedCount++; rightLineNum++; }
      else if (r.type === 'unchanged') rightLineNum++;

      const leftNum = l.type === 'empty' ? '' : leftLineNum;
      const rightNum = r.type === 'empty' ? '' : rightLineNum;

      const leftSign = l.type === 'removed' ? '−' : (l.type === 'empty' ? '' : ' ');
      const rightSign = r.type === 'added' ? '+' : (r.type === 'empty' ? '' : ' ');

      html += `<tr>
        <td class="linenum ${leftClass}">${leftNum}</td>
        <td class="${leftClass} divider">${leftSign} ${escapeHtml(l.text)}</td>
        <td class="linenum ${rightClass}">${rightNum}</td>
        <td class="${rightClass}">${rightSign} ${escapeHtml(r.text)}</td>
      </tr>`;
    }

    html += '</tbody></table>';

    const container = document.getElementById('diffContainer');
    const output = document.getElementById('output');
    const stats = document.getElementById('stats');

    if (leftRows.length === 0) {
      container.innerHTML = '<div class="empty-msg">No differences found — the texts are identical.</div>';
    } else {
      container.innerHTML = html;
    }

    stats.innerHTML = `<span class="added-count">+${addedCount} added</span> &nbsp; <span class="removed-count">−${removedCount} removed</span>`;
    output.style.display = 'block';
    output.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function clearAll() {
    document.getElementById('original').value = '';
    document.getElementById('modified').value = '';
    document.getElementById('output').style.display = 'none';
    document.getElementById('diffContainer').innerHTML = '';
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
